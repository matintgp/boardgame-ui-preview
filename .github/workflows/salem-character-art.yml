name: Salem — build 15 character illustrations
on:
  push:
    branches: [main]
    paths:
      - scripts/generate-townhall-art.py
      - .github/workflows/salem-character-art.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render original role illustrations
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python scripts/generate-townhall-art.py
          test "$(find salem/assets/townhall-art -name '*.webp' | wc -l)" -eq 15
      - name: Publish role illustrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salem/assets/townhall-art
          if ! git diff --cached --quiet; then
            git commit -m "Publish fifteen Town Hall illustrated role cards"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
