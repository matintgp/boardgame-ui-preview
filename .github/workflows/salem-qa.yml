name: Salem — gameplay and security smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'salem/**'
      - 'scripts/salem-smoke.cjs'
      - '.github/workflows/salem-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: salem-smoke-main
  cancel-in-progress: true

jobs:
  salem-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check salem/assets/salem-engine.js
          node --check scripts/salem-smoke.cjs
      - name: Install isolated test-only DOM dependency
        run: |
          mkdir -p /tmp/salem-smoke-deps
          npm install --prefix /tmp/salem-smoke-deps --no-save --no-audit --no-fund jsdom@26
      - name: Rule flow, secrecy and asset tests
        env:
          NODE_PATH: /tmp/salem-smoke-deps/node_modules
        run: node --test scripts/salem-smoke.cjs

      - name: Publish latest verified QA result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          {
            echo '# Salem smoke test — latest verified pass'
            echo
            echo '- Result: **PASS** (all automated tests succeeded)'
            echo "- Tested Git commit: ${GITHUB_SHA}"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'This is a frontend smoke test, not a security certification.'
          } > docs/SALEM_QA_STATUS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SALEM_QA_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified Salem QA smoke test success [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
